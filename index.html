<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SGA - Sistema de Gestão de Arquivo - Acesso restrito">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>SGA | Login</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=20261009.3">
</head>
<body class="login-page">

  <main class="login-container" role="main">
    <div class="login-card">

      <header class="login-header">
        <h1>SGA</h1>
        <p>Sistema de Gestão de Arquivo</p>
      </header>

      <form id="form-login" class="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="seu@email.com.br"
            autocomplete="email"
            required
            maxlength="120"
          >
          <span class="field-error" id="error-email" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Senha</label>
          <div class="input-password">
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              minlength="6"
              maxlength="72"
            >
            <button type="button" class="btn-eye" id="btn-toggle-pass" aria-label="Mostrar senha" tabindex="-1">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="error-password" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="login-remember">
            <span>Lembrar-me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-login">
          <span class="btn-label">Entrar</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

        <div class="login-alert" id="login-alert" role="alert" hidden></div>
      </form>

      <footer class="login-footer">
        <p>&copy; 2026 SGA - OrbytaDev &mdash; Acesso restrito a usuários autorizados</p>
      </footer>

    </div>
  </main>

  <script src="assets/js/config.js?v=20261009.3"></script>
  <script src="assets/js/api.js?v=20261009.3"></script>
  <script src="assets/js/app.js?v=20261009.3"></script>
</body>
</html>
